<svg width="900" height="150" viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A two-process circadian alertness curve across 24 hours, with a gold marker at the late-morning peak">
  <!-- transparent background: renders on both light and dark GitHub themes -->

  <!-- faint area under the curve -->
  <path d="M40,95 C 90,110 130,118 177,118 C 250,116 330,38 415,36 C 470,35 505,62 552,62 C 600,62 645,44 689,46 C 745,50 815,90 860,108 L 860,126 L 40,126 Z"
        fill="#2dd4bf" opacity="0.07"/>

  <!-- alertness curve -->
  <path d="M40,95 C 90,110 130,118 177,118 C 250,116 330,38 415,36 C 470,35 505,62 552,62 C 600,62 645,44 689,46 C 745,50 815,90 860,108"
        fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round"/>

  <!-- baseline -->
  <line x1="40" y1="126" x2="860" y2="126" stroke="#7d8590" stroke-width="1" opacity="0.5"/>

  <!-- peak marker -->
  <circle cx="415" cy="36" r="4.5" fill="#d4a017"/>
  <text x="415" y="22" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#d4a017">peak</text>

  <!-- trough marker -->
  <circle cx="177" cy="118" r="3" fill="#7d8590"/>

  <!-- hour ticks -->
  <text x="40"  y="143" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#7d8590">00</text>
  <text x="245" y="143" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#7d8590">06</text>
  <text x="450" y="143" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#7d8590">12</text>
  <text x="655" y="143" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#7d8590">18</text>
  <text x="860" y="143" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#7d8590">24</text>

  <!-- caption -->
  <text x="860" y="18" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#7d8590">alertness, the two-process model — plan around your biology</text>
</svg>
